# Final gate before merge (docs/testing/testing-strategy.md §3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://virzeen:virzeen@localhost:5432/virzeen_ci
  DATABASE_URL_TEST: postgresql://virzeen:virzeen@localhost:5432/virzeen_test
  E2E_DATABASE_URL: postgresql://virzeen:virzeen@localhost:5432/virzeen_e2e
  MAILPIT_URL: http://localhost:8025

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: virzeen
          POSTGRES_PASSWORD: virzeen
          POSTGRES_DB: virzeen_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U virzeen" --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["8025:8025"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test databases
        run: |
          PGPASSWORD=virzeen psql -h localhost -U virzeen -d virzeen_ci -c "CREATE DATABASE virzeen_test;"
          PGPASSWORD=virzeen psql -h localhost -U virzeen -d virzeen_ci -c "CREATE DATABASE virzeen_e2e;"
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Migrations apply cleanly on an empty database
        run: pnpm --filter @virzeen/db exec prisma migrate deploy
      - name: UI guard
        run: node scripts/check-ui.mjs --all
      - name: Format
        run: pnpm format:check
      - name: Install Playwright browser
        run: pnpm --filter @virzeen/web exec playwright install --with-deps chromium
      - name: Lint, typecheck, unit/integration/component tests
        run: pnpm turbo run lint typecheck test
      - name: Dependency audit (high/critical fail)
        run: pnpm audit --audit-level high
      - name: End-to-end journeys
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
