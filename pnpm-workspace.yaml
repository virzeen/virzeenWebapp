packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true
# Security patches for transitive dependencies of the Prisma CLI (pnpm audit, CI). Remove once Prisma ships them.
overrides:
  deepmerge-ts: ">=8.0.0 <9" # GHSA-ggr8-5vv4-36mx; @prisma/config only calls deepmerge()
  mysql2: ">=3.22.0 <4" # GHSA-3f6p-5ww8-9rcr; MySQL driver, unused (Postgres)
  # 2026-11-09 audit (CI): transitive dev/build tools without a fixed parent release yet.
  handlebars: ">=4.7.10 <5" # GHSA-8r5x-fm3f-whwj, GHSA-p8wg-vrv2-v86f; only eslint-plugin-boundaries
  source-map-js: ">=1.2.2 <2" # postcss (Next.js build, Vite)
  zod: ">=4.6.6 <5" # better-auth 1.7.7 pins zod 4.6.5 (memory exhaustion advisory)
minimumReleaseAgeExclude:
  - "@turbo/darwin-64@2.11.5"
  - "@turbo/darwin-arm64@2.11.5"
  - "@turbo/linux-64@2.11.5"
  - "@turbo/linux-arm64@2.11.5"
  - "@turbo/windows-64@2.11.5"
  - "@turbo/windows-arm64@2.11.5"
  - turbo@2.11.5
